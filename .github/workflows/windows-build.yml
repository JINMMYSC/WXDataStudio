name: Windows Build

on:
  push:
    branches:
      - main
      - work/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/WXDataStudio.App/WXDataStudio.App.csproj
      - name: Build
        run: dotnet build src/WXDataStudio.App/WXDataStudio.App.csproj -c Release --no-restore

      - name: Smoke tests
        run: dotnet run --project tests/WXDataStudio.Smoke/WXDataStudio.Smoke.csproj -c Release

      - name: Publish Windows x64
        run: >-
          dotnet publish src/WXDataStudio.App/WXDataStudio.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o artifacts/WXDataStudio-win-x64

      - name: Bundle Android Platform Tools
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\platform-tools.zip"
          $out = "$env:RUNNER_TEMP\platform-tools"
          Invoke-WebRequest -Uri "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $out -Force
          $dest = "artifacts/WXDataStudio-win-x64/tools/android/platform-tools"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item "$out/platform-tools/*" $dest -Recurse -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WXDataStudio-win-x64
          path: artifacts/WXDataStudio-win-x64/**
          if-no-files-found: error
